name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Garde-fou : tokens.css est généré depuis le guide d'identité. Si
      # quelqu'un l'a édité à la main, la ré-extraction produit un diff et
      # le CI échoue plutôt que de laisser le code diverger de la marque.
      - name: Jetons de design synchronisés
        run: |
          pnpm --filter @velora/design-system sync-tokens
          git diff --exit-code packages/design-system/tokens.css

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build
        env:
          # Le build Next n'a pas besoin des vrais secrets, mais l'API valide
          # sa configuration au démarrage — pas au build.
          NODE_ENV: production
